# ==============================================================================
# AWS Amplify Hosting Build Specification
# Track: Servers and runtimes (Amplify, App Runner) + The plumbing (CloudFront)
# ==============================================================================
version: 1
frontend:
  phases:
    preBuild:
      commands:
        - npm ci
    build:
      commands:
        - npm run build
  artifacts:
    baseDirectory: dist
    files:
      - '**/*'
  cache:
    paths:
      - node_modules/**/*
